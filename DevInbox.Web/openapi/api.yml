openapi: 3.0.3
info:
  title: Dev Inbox API
  version: 0.1.0
  description: Unified API for Dev Inbox — auth, inbox, notes, settings, sync

servers:
  - url: /api
    description: Base API path

tags:
  - name: auth
    description: Authentication operations
  - name: integrations
    description: Third-party integration connections (GitHub, Azure DevOps)
  - name: settings
    description: User settings and integration credentials
  - name: inbox
    description: Inbox items
  - name: saved-views
    description: Saved filter presets
  - name: notes
    description: Personal notes
  - name: sync
    description: Manual sync triggers
  - name: health
    description: Health and readiness

paths:
  # ── Auth ─────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password — sets HttpOnly jwt cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful; jwt cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the jwt session cookie
      responses:
        "204":
          description: Logged out successfully

  /auth/me:
    post:
      operationId: me
      security:
        - cookieAuth: []
      tags: [auth]
      summary: Returns current user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "204":
          description: No user found

  /auth/github:
    get:
      operationId: githubAuth
      tags: [auth]
      summary: Starts GitHub login flow
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization endpoint
          headers:
            Location:
              description: GitHub authorization URL
              schema:
                type: string
                format: uri

  /auth/github/callback:
    get:
      operationId: githubAuthCallback
      tags: [auth]
      summary: Handles GitHub OAuth callback and redirects to inbox
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects the authenticated user to the inbox
          headers:
            Location:
              description: Relative URL of the application inbox
              schema:
                type: string
                example: /inbox
        "400":
          description: Missing or invalid OAuth callback parameters
        "401":
          description: Authentication failed

  # ── Integrations ─────────────────────────────────────────────
  /integrations/github/pat:
    post:
      operationId: connectGithubPat
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: Connect (or reconnect) GitHub using a Personal Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectPatRequest"
      responses:
        "200":
          description: GitHub integration connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDto"
        "400":
          description: Invalid or unreachable PAT
        "401":
          description: No authenticated user
  /integrations/ado/pat:
    post:
      operationId: connectAdoPat
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: Connect (or reconnect) Azure Devops using a Personal Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectPatRequest"
      responses:
        "200":
          description: Azure Devops integration connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDto"
        "400":
          description: Invalid or unreachable PAT
        "401":
          description: No authenticated user          
  /integrations/ado/organizations:
    get:
      operationId: getAdoOrganizations
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: List the Azure DevOps organizations currently usable by the connected PAT (auto-discovered and/or manually added)
      responses:
        "200":
          description: Usable Azure DevOps organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdoOrganizationDto"
        "401":
          description: No authenticated user
        "404":
          description: No Azure Devops integration connected
    post:
      operationId: addAdoOrganization
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: Manually add an Azure DevOps organization, validating that the connected PAT can access it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdoOrganizationRequest"
      responses:
        "200":
          description: Usable Azure DevOps organizations, including the newly added one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdoOrganizationDto"
        "400":
          description: The PAT cannot access the given organization
        "401":
          description: No authenticated user
        "404":
          description: No Azure Devops integration connected

  /integrations/github:
    delete:
      operationId: disconnectGithub
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: Disconnect the GitHub integration for the current user
      responses:
        "204":
          description: GitHub integration disconnected
        "401":
          description: No authenticated user
        "404":
          description: No GitHub integration to disconnect
  /integrations/ado:
    delete:
      operationId: disconnectAdo
      security:
        - cookieAuth: []
      tags: [integrations]
      summary: Disconnect the Azure Devops integration for the current user
      responses:
        "204":
          description: Azure Devops integration disconnected
        "401":
          description: No authenticated user
        "404":
          description: No Azure Devops integration to disconnect          

  # ── Settings ─────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsDto"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"

  # ── Inbox ─────────────────────────────────────────────────────
  /inbox:
    get:
      operationId: listInboxItems
      tags: [inbox]
      summary: List inbox items with optional filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/ItemSource"
        - name: itemType
          in: query
          schema:
            $ref: "#/components/schemas/ItemType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ItemStatus"
        - name: reason
          in: query
          schema:
            $ref: "#/components/schemas/InboxReason"

      responses:
        "200":
          description: Paginated list of inbox items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPage"

  /inbox/status:
    get:
      operationId: getInboxStatus
      tags: [inbox]
      summary: Get the status of the inbox
      responses:
        "200":
          description: Inbox item status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxStatus"
        "404":
          description: Not found
  /inbox/summary:
    get:
      operationId: getInboxSummary
      tags: [inbox]
      summary: Get the summary of the inbox
      responses:
        "200":
          description: Inbox summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxSummary"
        "404":
          description: Not found
  /inbox/seed:
    put:
      operationId: putInboxSeed
      tags: [inbox]
      deprecated: true
      summary: Seeds inbox with random elements for testing
      responses:
        "204":
          description: Inbox items created
        "404":
          description: Not found

  /inbox/item/{id}:
    get:
      operationId: getInboxItem
      tags: [inbox]
      summary: Get a single inbox item with full detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Inbox item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemDetail"
        "404":
          description: Not found
  /inbox/item/{id}/done:
    post:
      operationId: markInboxItemDone
      tags: [inbox]
      summary: Mark a single inbox item as done
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: isDone
          in: query
          required: true
          schema:
            type: boolean    
      responses:
        "204":
          description: Inbox item marked as done
        "404":
          description: Not found          
  /inbox/item/{id}/save:
    post:
      operationId: saveInboxItem
      tags: [inbox]
      summary: Save a single inbox item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: save
          in: query
          required: true
          schema:
            type: boolean    
      responses:
        "204":
          description: Inbox item saved
        "404":
          description: Not found               

  /inbox/item/{id}/overlay:
    put:
      operationId: updateItemOverlay
      tags: [inbox]
      summary: Update personal overlay for an inbox item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemOverlayRequest"
      responses:
        "200":
          description: Overlay updated

  # ── Saved Views ───────────────────────────────────────────────
  /saved-views:
    get:
      operationId: listSavedViews
      tags: [saved-views]
      summary: List saved filter views
      responses:
        "200":
          description: Saved views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedViewDto"
    post:
      operationId: createSavedView
      tags: [saved-views]
      summary: Create a saved view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedViewRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedViewDto"

  # ── Notes ─────────────────────────────────────────────────────
  # Notes are inbox items (Source=Note) — list/browse them via GET /inbox/items?source=Note or
  # GET /inbox/item/{id}, which returns the same NoteDetail nested under InboxItemDetail.note.
  # This surface only covers note-specific write actions.
  /notes:
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetail"

  /notes/{id}:
    put:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetail"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted

  # ── Sync ──────────────────────────────────────────────────────
  /sync/trigger:
    post:
      operationId: triggerSync
      tags: [sync]
      summary: Manually trigger a full sync
      responses:
        "202":
          description: Sync accepted

  # ── Health ────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
      description: JWT token stored in HttpOnly cookie

  schemas:
    # ── Auth ───────────────────────────────────────────────────
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserDto:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationDto"

    AccountType:
      type: string
      enum: [REGULAR, OAUTH_GITHUB]

    SyncStatus:
      type: string
      enum: [Idle, Running, Failed]

    IntegrationDto:
      type: object
      additionalProperties: false
      required: [status, type]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/IntegrationStatus"
        type:
          $ref: "#/components/schemas/IntegrationType"
        authMethod:
          $ref: "#/components/schemas/IntegrationAuthMethod"       

    IntegrationType:
      type: string
      enum: [Github, Ado]
    
    IntegrationAuthMethod:
      type: string  
      enum: [Pat, OAuthApp]

    IntegrationStatus:
      type: string
      default: INACTIVE
      enum: [ACTIVE, EXPIRED, INACTIVE]

    ConnectPatRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Personal Access Token (classic or fine-grained).
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry date for the PAT — used to proactively warn the user before it expires.

    AdoOrganizationDto:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Azure DevOps organization name (e.g. "contoso" for https://dev.azure.com/contoso).

    AddAdoOrganizationRequest:
      type: object
      additionalProperties: false
      required: [organizationName]
      properties:
        organizationName:
          type: string
          description: Azure DevOps organization name to add — validated against the connected PAT before being stored.

    # ── Settings ───────────────────────────────────────────────
    Theme:
      type: string
      enum: [light, dark]
      x-enumNames: [Light, Dark]

    Density:
      type: string
      enum: [relaxed, tight, super-tight]
      # x-enumNames: NSwag extension — lets us keep hyphenated wire values (e.g. "super-tight")
      # while generating valid C#/TS identifiers (SuperTight) for the enum members.
      x-enumNames: [Relaxed, Tight, SuperTight]

    UserSettingsDto:
      type: object
      additionalProperties: false
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        density:
          $ref: "#/components/schemas/Density"
        fontSize:
          type: integer
        sideBarCollapsed:
          type: boolean
        githubRepos:
          type: array
          items:
            type: string
        adoOrganization:
          type: string
        adoProject:
          type: string
        syncIntervalMinutes:
          type: integer

    # ── Inbox ──────────────────────────────────────────────────
    InboxPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItemSummary"
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
    InboxStatus:
      type: object
      additionalProperties: false
      properties:
        lastUpdatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        syncStatus:
          $ref: "#/components/schemas/SyncStatus"
        lastSyncStartedAt:
          type: string
          format: date-time
        lastSyncCompletedAt:
          type: string
          format: date-time

    InboxSummary:
        type: object
        additionalProperties: false
        description: Aggregated status/counts calculated while loading the inbox page. This is not used
        properties:
          total:
            type: integer
            format: int64
            description: Total number of inbox items
          toDo:
            type: integer
            format: int64
            description: Number of inbox items that are not done
          saved:
            type: integer
            format: int64
            description: Number of inbox items that are saved and not done
          needsAttention:
            type: integer
            format: int64
            description: Number of inbox items that are high or critical priority
          stale:
            type: integer
            format: int64
            description: Number of inbox items that have not been updated for a long time
          reviewRequests:
            type: integer
            format: int64
            description: Number of inbox items that are require review
          mentions:
            type: integer
            format: int64
            description: Number of inbox items that mention the user
          myPullRequests:
            type: integer
            format: int64
            description: Number of inbox items that are authored by the user
          adoItems:
            type: integer
            format: int64
            description: Number of inbox items that are ADO items
          notes:
            type: integer
            format: int64
            description: Number of inbox items that are notes

    InboxItemSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        sourceType:
          $ref: "#/components/schemas/ItemSource"
        itemType:
          $ref: "#/components/schemas/ItemType"
        title:
          type: string
        repository:
          type: string
        reason:
          $ref: "#/components/schemas/InboxReason"
        isClosed:
          type: boolean
        isSaved:
          type: boolean
        isDone:
          type: boolean
        isPinned:
          type: boolean
        priority:
          $ref: "#/components/schemas/Priority"
        commentCount:
          type: integer
          format: int64          
        hasNote:
          type: boolean  
        activityAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InboxItemDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/ItemSource"
        itemType:
          $ref: "#/components/schemas/ItemType"
        reason:
          $ref: "#/components/schemas/InboxReason"
        priority:
          $ref: "#/components/schemas/Priority"
        isClosed:
          type: boolean
        isSaved:
          type: boolean
        isDone:
          type: boolean
        github:
          $ref: "#/components/schemas/GitHubPullRequestDetail"
        ado:
          $ref: "#/components/schemas/AdoWorkItemDetail"
        note:
          $ref: "#/components/schemas/NoteDetail"
        attachedNote:
          $ref: "#/components/schemas/NoteDetail"
        commentCount:
          type: integer
          format: int64  

    GitHubPullRequestDetail:
      type: object
      additionalProperties: false
      properties:
        pullRequestNumber:
          type: integer
        repository:
          type: string
        title:
          type: string
        summary:
          type: string
        state:
          $ref: "#/components/schemas/GitHubPullRequestState"
        url:
          type: string
        author:
          $ref: "#/components/schemas/PersonReference"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestReviewer"
        labels:
          type: array
          items:
            type: string
        linkedWorkItems:
          type: array
          items:
            $ref: "#/components/schemas/LinkedItem"
        latestComments:
          type: array
          items:
            $ref: "#/components/schemas/CommentPreview"

    PullRequestReviewer:
      type: object
      additionalProperties: false
      properties:
        reviewer:
          $ref: "#/components/schemas/PersonReference"
        reviewState:
          $ref: "#/components/schemas/ReviewState"
    GitHubPullRequestState:
      type: string
      enum:
        - open
        - draft
        - merged
        - closed

    LinkedItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string    

    ReviewState:
      type: string
      enum:
        - waiting
        - approved
        - changesRequested
        - commented

    AdoWorkItemDetail:
      type: object
      additionalProperties: false
      properties:
        workItemId:
          type: string
        project:
          type: string
        title:
          type: string
        workItemType:
          type: string
        state:
          type: string
        description:
          type: string
        area:
          type: string
        assignedTo:
          $ref: "#/components/schemas/PersonReference"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
        tags:
          type: array
          items:
            type: string
        parent:
          $ref: "#/components/schemas/LinkedItem"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentPreview"

    NoteDetail:
      type: object
      additionalProperties: false
      properties:
        noteId:
          type: integer
          format: int64
        inboxItemId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        linkedItem:
          $ref: "#/components/schemas/LinkedItem"

    CommentPreview:
      type: object
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/PersonReference"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        url:
          type: string

    PersonReference:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string

    ItemOverlayRequest:
      type: object
      additionalProperties: false
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        isClosed:
          type: boolean
        isSaved:
          type: boolean
        isDone:
          type: boolean
        isPinned:
          type: boolean
        privateNote:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
