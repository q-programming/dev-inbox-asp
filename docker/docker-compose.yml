name: devinbox

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: devinbox:latest
    container_name: devinbox-app
    # Lets the container reach a Postgres published on the host (Host=host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${CONNECTION_STRING:?set CONNECTION_STRING in docker/.env}
      # EnsureCreated on startup (no EF migrations yet) — only creates the schema on an empty database
      Database__AutoMigrate: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in docker/.env}
      Encryption__Password: ${ENCRYPTION_PASSWORD:?set ENCRYPTION_PASSWORD in docker/.env}
      Encryption__Salt: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT in docker/.env}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in docker/.env}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in docker/.env}
      # Leave empty: frontend is served from the same origin as the API
      GitHub__FrontendUrl: ${FRONTEND_URL:-}
      ADO__BaseUrl: ${ADO_BASE_URL:-https://dev.azure.com}
    restart: unless-stopped
