name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 – Build & Generate
# Compiles the .NET project and generates all NSwag outputs (C# stubs + TS client).
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Generate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DevInbox.Web/ClientApp/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: DevInbox.Web/ClientApp

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (generates NSwag C# + TS clients)
        run: dotnet build DevInbox.Web/DevInbox.Web.csproj --configuration Release /p:GenerateClients=true

      - name: Upload generated TypeScript client
        uses: actions/upload-artifact@v7
        with:
          name: ts-generated-client
          path: DevInbox.Web/ClientApp/generated/
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 – Backend Tests
# Runs xUnit tests with Testcontainers (Docker available on ubuntu-latest).
# ──────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Run backend tests
        run: dotnet test DevInbox.Web.Tests/DevInbox.Web.Tests.csproj --configuration Release --settings .runsettings --logger trx --results-directory DevInbox.Web.Tests/test-results --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend Test Results
          path: DevInbox.Web.Tests/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: DevInbox.Web.Tests/test-results/**/coverage.cobertura.xml
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 3 – Frontend Tests
# Runs Vitest browser tests (Playwright/Chromium, headless) with V8 coverage.
# Downloads pre-generated TypeScript client from the build job.
# ──────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DevInbox.Web/ClientApp/package-lock.json

      - name: Download generated TypeScript client
        uses: actions/download-artifact@v7
        with:
          name: ts-generated-client
          path: DevInbox.Web/ClientApp/generated/

      - name: Install npm dependencies
        run: npm ci
        working-directory: DevInbox.Web/ClientApp

      - name: Install Playwright Chromium & system deps
        run: npx playwright install chromium --with-deps
        working-directory: DevInbox.Web/ClientApp

      - name: Run frontend tests with coverage
        # Vitest's browser-mode dep-optimizer has a known cold-start race
        # (vitest-dev/vitest#8471, #10812) that intermittently fails a spec
        # file's import with "Vitest failed to find the runner" the first
        # time it runs against a freshly installed node_modules — exactly
        # what every CI run does. Retrying the whole command lets it reuse
        # the now-warm Vite dep cache, after which the suite is stable.
        run: npm run test:coverage || npm run test:coverage
        working-directory: DevInbox.Web/ClientApp

      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Frontend Test Results
          path: DevInbox.Web/ClientApp/test-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: DevInbox.Web/ClientApp/coverage/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# Job 4 – Post Coverage (PR only)
# Posts a combined frontend coverage comment on the PR.
# ──────────────────────────────────────────────────────────────────────────────
  post-coverage:
    name: Post Coverage Comment
    needs: [test-backend, test-frontend]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend coverage report
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: frontend-coverage/
        continue-on-error: true

      - name: Download backend coverage report
        uses: actions/download-artifact@v7
        with:
          name: backend-coverage
          path: backend-coverage/
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const THRESHOLD = 70;
            const icon = (pct) => (pct !== undefined && pct >= THRESHOLD) ? '✅' : '⚠️';
            const pf = (v) => v !== undefined ? `${(v * 100).toFixed(2)}%` : 'N/A';

            // ── Frontend: parse Vitest JSON summary ──────────────────────
            let frontend = null;
            try {
              const summary = JSON.parse(fs.readFileSync('frontend-coverage/coverage-summary.json', 'utf8'));
              const t = summary.total;
              frontend = {
                Lines:      t.lines.pct,
                Branches:   t.branches.pct,
                Functions:  t.functions.pct,
                Statements: t.statements.pct,
              };
            } catch (e) {
              console.log('No frontend coverage:', e.message);
            }

            // ── Backend: parse coverlet Cobertura XML ────────────────────
            let backend = null;
            try {
              const files = fs.readdirSync('backend-coverage', { recursive: true });
              const xmlFile = files.map(f => `backend-coverage/${f}`).find(f => String(f).endsWith('.xml'));
              if (xmlFile) {
                const xml = fs.readFileSync(xmlFile, 'utf8');
                const lineRate   = parseFloat(xml.match(/line-rate="([^"]+)"/)?.[1] ?? '0') * 100;
                const branchRate = parseFloat(xml.match(/branch-rate="([^"]+)"/)?.[1] ?? '0') * 100;
                backend = {
                  Lines:    lineRate.toFixed(2),
                  Branches: branchRate.toFixed(2),
                };
              }
            } catch (e) {
              console.log('No backend coverage:', e.message);
            }

            const MARKER = '<!-- coverage-report -->';
            let body = `${MARKER}\n## 📊 Test Coverage Report\n\n`;
            body += `> ✅ ≥ ${THRESHOLD}% &nbsp;|&nbsp; ⚠️ below ${THRESHOLD}%\n\n`;

            if (frontend) {
              body += '### 🖥️ Frontend (Vitest V8)\n\n';
              body += '| Metric | Coverage |\n|--------|----------|\n';
              for (const [label, pct] of Object.entries(frontend)) {
                body += `| ${label} | ${icon(pct)} ${pct}% |\n`;
              }
              body += '\n';
            } else {
              body += '### 🖥️ Frontend (Vitest V8)\n\n_No data — tests may have failed._\n\n';
            }

            if (backend) {
              body += '### ⚙️ Backend (coverlet)\n\n';
              body += '| Metric | Coverage |\n|--------|----------|\n';
              body += `| Lines | ${icon(parseFloat(backend.Lines))} ${backend.Lines}% |\n`;
              body += `| Branches | ${icon(parseFloat(backend.Branches))} ${backend.Branches}% |\n`;
            } else {
              body += '### ⚙️ Backend (coverlet)\n\n_No data — tests may have failed._\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
