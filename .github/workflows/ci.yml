name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter and Madrapps/jacoco-report need these permissions
permissions:
  checks: write
  pull-requests: write
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 – Build & Generate Sources
# Compiles the project and generates all OpenAPI stubs (Java + TypeScript).
# Subsequent test jobs depend on this so they fail fast on a broken build.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Generate Sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Generate sources & compile (no tests)
        run: ./mvnw clean generate-sources compile -DskipTests -B

      - name: Upload generated TypeScript clients
        uses: actions/upload-artifact@v4
        with:
          name: ts-generated-clients
          path: src/main/webapp/generated/
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 – Backend Tests
# Runs Java (Surefire + Testcontainers) tests and collects JaCoCo coverage.
# Docker is available on ubuntu-latest; Testcontainers uses the host socket.
# ──────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Java tests (skip frontend)
        run: ./mvnw clean generate-sources test -DskipFrontend=true -B

      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# Job 3 – Frontend Tests
# Runs Vitest browser tests (Playwright/Chromium, headless) and V8 coverage.
# Downloads the pre-generated TypeScript API clients from the build job.
# ──────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Download generated TypeScript clients
        uses: actions/download-artifact@v4
        with:
          name: ts-generated-clients
          path: src/main/webapp/generated/

      - name: Install npm dependencies
        run: npm ci --prefix src/main/webapp

      - name: Install Playwright Chromium & system deps
        run: npx playwright install chromium --with-deps
        working-directory: src/main/webapp

      - name: Run frontend tests with coverage
        run: npm run test:coverage --prefix src/main/webapp

      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Test Results
          path: src/main/webapp/test-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/main/webapp/coverage/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# Job 4 – Post Coverage (PR only)
# Downloads both coverage artifacts and posts a single combined comment on the PR.
# Uses only GITHUB_TOKEN — no PAT needed.
# ──────────────────────────────────────────────────────────────────────────────
  post-coverage:
    name: Post Coverage Comment
    needs: [test-backend, test-frontend]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco/
        continue-on-error: true

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage/
        continue-on-error: true

      - name: Post combined coverage comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const THRESHOLD = 70;
            const icon = (pct) => (pct !== undefined && pct >= THRESHOLD) ? '✅' : '⚠️';

            // ── Backend: parse JaCoCo XML ────────────────────────────────
            let backend = null;
            try {
              const xml = fs.readFileSync('jacoco/jacoco.xml', 'utf8');
              // Report-level counters appear after the last </package> tag.
              const afterPackages = xml.includes('</package>')
                ? xml.substring(xml.lastIndexOf('</package>') + '</package>'.length)
                : xml;
              const rx = /<counter type="(\w+)" missed="(\d+)" covered="(\d+)"\/>/g;
              let m;
              backend = {};
              while ((m = rx.exec(afterPackages)) !== null) {
                const missed = parseInt(m[2]), covered = parseInt(m[3]);
                const total = missed + covered;
                backend[m[1]] = total > 0 ? Math.round(covered / total * 100) : 0;
              }
              if (Object.keys(backend).length === 0) backend = null;
            } catch (e) {
              console.log('No JaCoCo report:', e.message);
            }

            // ── Frontend: parse Vitest JSON summary ──────────────────────
            let frontend = null;
            try {
              const summary = JSON.parse(fs.readFileSync('frontend-coverage/coverage-summary.json', 'utf8'));
              const t = summary.total;
              frontend = {
                Lines:      t.lines.pct,
                Branches:   t.branches.pct,
                Functions:  t.functions.pct,
                Statements: t.statements.pct,
              };
            } catch (e) {
              console.log('No frontend coverage:', e.message);
            }

            // ── Build comment body ────────────────────────────────────────
            const MARKER = '<!-- coverage-report -->';
            let body = `${MARKER}\n## 📊 Test Coverage Report\n\n`;
            body += `> ✅ ≥ ${THRESHOLD}% &nbsp;|&nbsp; ⚠️ below ${THRESHOLD}%\n\n`;

            if (backend) {
              body += '### 🔧 Backend (JaCoCo)\n\n';
              body += '| Metric | Coverage |\n|--------|----------|\n';
              for (const [type, pct] of Object.entries(backend)) {
                body += `| ${type} | ${icon(pct)} ${pct}% |\n`;
              }
              body += '\n';
            } else {
              body += '### 🔧 Backend (JaCoCo)\n\n_No data — tests may have failed._\n\n';
            }

            if (frontend) {
              body += '### 🖥️ Frontend (Vitest V8)\n\n';
              body += '| Metric | Coverage |\n|--------|----------|\n';
              for (const [label, pct] of Object.entries(frontend)) {
                body += `| ${label} | ${icon(pct)} ${pct}% |\n`;
              }
            } else {
              body += '### 🖥️ Frontend (Vitest V8)\n\n_No data — tests may have failed._\n';
            }

            // ── Update or create comment ──────────────────────────────────
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
