name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 – Build & Generate
# Compiles the .NET project and generates all NSwag outputs (C# stubs + TS client).
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Generate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DevInbox.Web/ClientApp/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: DevInbox.Web/ClientApp

      - name: Build (generates NSwag C# + TS clients)
        run: dotnet build DevInbox.Web/DevInbox.Web.csproj --configuration Release

      - name: Upload generated TypeScript client
        uses: actions/upload-artifact@v4
        with:
          name: ts-generated-client
          path: DevInbox.Web/ClientApp/generated/
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 – Backend Tests
# Runs xUnit tests with Testcontainers (Docker available on ubuntu-latest).
# ──────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run backend tests
        run: dotnet test DevInbox.Web/DevInbox.Web.csproj --configuration Release --logger "junit;LogFilePath=test-results/results.xml" --no-build
        continue-on-error: true

      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: DevInbox.Web/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

# ──────────────────────────────────────────────────────────────────────────────
# Job 3 – Frontend Tests
# Runs Vitest browser tests (Playwright/Chromium, headless) with V8 coverage.
# Downloads pre-generated TypeScript client from the build job.
# ──────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DevInbox.Web/ClientApp/package-lock.json

      - name: Download generated TypeScript client
        uses: actions/download-artifact@v4
        with:
          name: ts-generated-client
          path: DevInbox.Web/ClientApp/generated/

      - name: Install npm dependencies
        run: npm ci
        working-directory: DevInbox.Web/ClientApp

      - name: Install Playwright Chromium & system deps
        run: npx playwright install chromium --with-deps
        working-directory: DevInbox.Web/ClientApp

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: DevInbox.Web/ClientApp

      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Test Results
          path: DevInbox.Web/ClientApp/test-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: DevInbox.Web/ClientApp/coverage/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# Job 4 – Post Coverage (PR only)
# Posts a combined frontend coverage comment on the PR.
# ──────────────────────────────────────────────────────────────────────────────
  post-coverage:
    name: Post Coverage Comment
    needs: [test-backend, test-frontend]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage/
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const THRESHOLD = 70;
            const icon = (pct) => (pct !== undefined && pct >= THRESHOLD) ? '✅' : '⚠️';

            // ── Frontend: parse Vitest JSON summary ──────────────────────
            let frontend = null;
            try {
              const summary = JSON.parse(fs.readFileSync('frontend-coverage/coverage-summary.json', 'utf8'));
              const t = summary.total;
              frontend = {
                Lines:      t.lines.pct,
                Branches:   t.branches.pct,
                Functions:  t.functions.pct,
                Statements: t.statements.pct,
              };
            } catch (e) {
              console.log('No frontend coverage:', e.message);
            }

            const MARKER = '<!-- coverage-report -->';
            let body = `${MARKER}\n## 📊 Test Coverage Report\n\n`;
            body += `> ✅ ≥ ${THRESHOLD}% &nbsp;|&nbsp; ⚠️ below ${THRESHOLD}%\n\n`;

            if (frontend) {
              body += '### 🖥️ Frontend (Vitest V8)\n\n';
              body += '| Metric | Coverage |\n|--------|----------|\n';
              for (const [label, pct] of Object.entries(frontend)) {
                body += `| ${label} | ${icon(pct)} ${pct}% |\n`;
              }
            } else {
              body += '### 🖥️ Frontend (Vitest V8)\n\n_No data — tests may have failed._\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
