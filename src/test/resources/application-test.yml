# Test profile - datasource overridden by @ServiceConnection from PostgresTestContainerConfig
# Let Hibernate create the schema on fresh Testcontainers DB (DatabaseInitializer is for production)
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  modulith:
    events:
      republish-outstanding-events-on-restart: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret

application:
  database-initializer:
    enabled: false
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLXRlc3Rpbmc= #not actual secret
    expiration-ms: 3600000
  encryption:
    password: test-password
    salt: test-salt

logging:
  level:
    pl.qprogramming.devinbox: WARN
