openapi: 3.0.3
info:
  title: Identity API
  version: 0.1.0
  description: User settings and integration credentials

servers:
  - url: /api
    description: Base API path

tags:
  - name: settings
    description: User settings and integration credentials

paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"

components:
  schemas:
    UserSettingsDto:
      type: object
      properties:
        githubRepos:
          type: array
          items:
            type: string
        adoOrganization:
          type: string
        adoProject:
          type: string
        syncIntervalMinutes:
          type: integer

    UpdateSettingsRequest:
      type: object
      properties:
        githubPat:
          type: string
        githubRepos:
          type: array
          items:
            type: string
        adoOrganization:
          type: string
        adoProject:
          type: string
        adoPat:
          type: string
        syncIntervalMinutes:
          type: integer

