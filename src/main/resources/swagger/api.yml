openapi: 3.0.3
info:
  title: Dev Inbox API
  version: 0.1.0
  description: Personal developer workspace — unified inbox for GitHub PRs, ADO work items and notes

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health and readiness
  - name: inbox
    description: Inbox items
  - name: notes
    description: Personal notes
  - name: settings
    description: User settings and integration credentials
  - name: sync
    description: Manual sync triggers
  - name: saved-views
    description: Saved filter presets

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: healthCheckOk
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /inbox:
    get:
      operationId: listInboxItems
      tags: [inbox]
      summary: List inbox items with optional filtering
      parameters:
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/ItemSource"
        - name: itemType
          in: query
          schema:
            $ref: "#/components/schemas/ItemType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ItemStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated list of inbox items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPage"

  /inbox/{id}:
    get:
      operationId: getInboxItem
      tags: [inbox]
      summary: Get a single inbox item with full detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inbox item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemDetail"
        "404":
          description: Not found

  /inbox/{id}/overlay:
    put:
      operationId: updateItemOverlay
      tags: [inbox]
      summary: Update personal overlay for an inbox item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemOverlayRequest"
      responses:
        "200":
          description: Overlay updated

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List personal notes
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteDto"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"

  /notes/{id}:
    put:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsDto"

  /sync/trigger:
    post:
      operationId: triggerSync
      tags: [sync]
      summary: Manually trigger a full sync
      responses:
        "202":
          description: Sync accepted

  /saved-views:
    get:
      operationId: listSavedViews
      tags: [saved-views]
      summary: List saved filter views
      responses:
        "200":
          description: Saved views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedViewDto"
    post:
      operationId: createSavedView
      tags: [saved-views]
      summary: Create a saved view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedViewRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedViewDto"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: UP

    InboxPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItemSummary"
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    InboxItemSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          $ref: "#/components/schemas/ItemSource"
        itemType:
          $ref: "#/components/schemas/ItemType"
        title:
          type: string
        subtitle:
          type: string
        repository:
          type: string
        reason:
          type: string
        isUnread:
          type: boolean
        isSaved:
          type: boolean
        isDone:
          type: boolean
        isPinned:
          type: boolean
        priority:
          $ref: "#/components/schemas/Priority"
        lastActivityAt:
          type: string
          format: date-time

    InboxItemDetail:
      allOf:
        - $ref: "#/components/schemas/InboxItemSummary"
        - type: object
          properties:
            privateNote:
              type: string
            tags:
              type: array
              items:
                type: string
            followUpAt:
              type: string
              format: date-time

    ItemOverlayRequest:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        isUnread:
          type: boolean
        isSaved:
          type: boolean
        isDone:
          type: boolean
        isPinned:
          type: boolean
        privateNote:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
          type: string
          format: date-time

    NoteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        followUpAt:
          type: string
          format: date-time

    UserSettingsDto:
      type: object
      properties:
        githubRepos:
          type: array
          items:
            type: string
        adoOrganization:
          type: string
        adoProject:
          type: string
        syncIntervalMinutes:
          type: integer

    UpdateSettingsRequest:
      type: object
      properties:
        githubPat:
          type: string
        githubRepos:
          type: array
          items:
            type: string
        adoOrganization:
          type: string
        adoProject:
          type: string
        adoPat:
          type: string
        syncIntervalMinutes:
          type: integer

    SavedViewDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        filterJson:
          type: string

    CreateSavedViewRequest:
      type: object
      required: [name, filterJson]
      properties:
        name:
          type: string
        filterJson:
          type: string

    # ── Standalone enums ────────────────────────────────────────────────────────

    ItemSource:
      type: string
      description: Origin system of an inbox item
      enum: [GITHUB, ADO, NOTE]

    ItemType:
      type: string
      description: Kind of item within its source system
      enum: [PR, ISSUE, WORK_ITEM, NOTE]

    ItemStatus:
      type: string
      description: Read / action status of an inbox item
      enum: [UNREAD, SAVED, DONE, PINNED]

    Priority:
      type: string
      description: User-assigned priority level
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

